# SIP — local development and plain-VPS deployment.
#
#   docker compose build web
#   docker compose up -d
#
# Railway does NOT run compose files; it builds each service from its own
# Dockerfile and ignores depends_on and port mappings. railway.json describes
# the web service there; the worker is a second Railway service pointed at
# packages/worker/Dockerfile.
#
# BOTH IMAGES BUILD FROM THE REPOSITORY ROOT, because the install needs
# pnpm-lock.yaml and the workspace; a build with packages/<name> as its context
# cannot see them.

x-chain-env: &chain-env
  # Everything the two services agree on. The RPC URL carries an API key and is
  # therefore server-side only — the browser reaches the chain through the web
  # app's own /api/rpc relay, never this value.
  NUVEM_RPC_URL: ${NUVEM_RPC_URL:?set NUVEM_RPC_URL}
  NUVEM_CHAIN_ID: ${NUVEM_CHAIN_ID:-4663}
  NUVEM_VAULT_FACTORY: ${NUVEM_VAULT_FACTORY:?set NUVEM_VAULT_FACTORY}
  NUVEM_SETTLEMENT_EXECUTOR: ${NUVEM_SETTLEMENT_EXECUTOR:?set NUVEM_SETTLEMENT_EXECUTOR}

services:
  web:
    build:
      context: .
      dockerfile: packages/website-oficial/Dockerfile
    environment:
      <<: *chain-env
      PRIVY_APP_ID: ${PRIVY_APP_ID:?set PRIVY_APP_ID}
      PRIVY_SIGNER_ID: ${PRIVY_SIGNER_ID:-}
      PRIVY_POLICY_ID: ${PRIVY_POLICY_ID:-}
      NUVEM_PUBLIC_RPC_URL: ${NUVEM_PUBLIC_RPC_URL:-}
      DATABASE_URL: ${DATABASE_URL:-}
      # The image's runner defaults to 3000 and Next reads PORT at start-up. The
      # repo's dev server uses 3002, so the container is told to match rather
      # than the port being mapped across — otherwise the health check below,
      # which runs INSIDE the container, probes a port nothing is listening on.
      PORT: 3002
    ports:
      - "3002:3002"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # DRY RUN UNLESS ARMED. The worker reads no signing secret at all unless
  # SIP_WORKER_ALLOW_BROADCAST is the exact sentence; see packages/worker/README.md.
  worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    environment:
      SIP_RPC_URLS: ${SIP_RPC_URLS:?set SIP_RPC_URLS}
      SIP_CHAIN_ID: ${NUVEM_CHAIN_ID:-4663}
      SIP_VAULT_FACTORY: ${NUVEM_VAULT_FACTORY:?set NUVEM_VAULT_FACTORY}
      SIP_SETTLEMENT_EXECUTOR: ${NUVEM_SETTLEMENT_EXECUTOR:?set NUVEM_SETTLEMENT_EXECUTOR}
      SIP_LOGS_FROM_BLOCK: ${SIP_LOGS_FROM_BLOCK:?set SIP_LOGS_FROM_BLOCK}
      SIP_DATABASE_URL: ${DATABASE_URL:-}
      SIP_WORKER_ALLOW_BROADCAST: ${SIP_WORKER_ALLOW_BROADCAST:-}
      SIP_ATTESTER_PRIVATE_KEY: ${SIP_ATTESTER_PRIVATE_KEY:-}
      PRIVY_APP_ID: ${PRIVY_APP_ID:-}
      PRIVY_APP_SECRET: ${PRIVY_APP_SECRET:-}
      PRIVY_AUTHORIZATION_PRIVATE_KEY: ${PRIVY_AUTHORIZATION_PRIVATE_KEY:-}
      PRIVY_SIGNER_ID: ${PRIVY_SIGNER_ID:-}
    restart: unless-stopped
