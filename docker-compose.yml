# SIP — the web service, on your own machine.
#
#   cp .env.example .env      # then fill it in
#   docker compose up --build
#
# This file exists so the web can be run and broken locally before it is run and
# broken in front of users: a production build of the web, from the web's
# Dockerfile, with the same environment contract.
#
# No platform reads this file or builds that image. The web is hosted on Vercel
# from source (docs/runbooks/VERCEL_WEB.md), and Railway runs only the keeper,
# configured by hand (docs/runbooks/RAILWAY_SOLANA.md). Compose is the
# rehearsal; those are the performance.
#
# THE IMAGE BUILDS FROM THE REPOSITORY ROOT, because the install needs
# pnpm-lock.yaml and the workspace; a build with packages/website-oficial as its
# context cannot see either.
#
# NO KEEPER, AND NO SIGNING SECRET. The web refuses SIP_SOLANA_SETTLE_KEY,
# SIP_SOLANA_PRIVY_APP_SECRET, SIP_SOLANA_PRIVY_AUTHORIZATION_KEY, PRIVY_APP_SECRET
# and PRIVY_AUTHORIZATION_PRIVATE_KEY by NAME, even blank, so none of them may be
# added below. See packages/website-oficial/.env.example.

services:
  web:
    build:
      context: .
      dockerfile: packages/website-oficial/Dockerfile
    environment:
      # Read at request time, never baked into the image.
      PRIVY_APP_ID: ${PRIVY_APP_ID:?set PRIVY_APP_ID}
      SIP_SOLANA_RPC_URLS: ${SIP_SOLANA_RPC_URLS:?set SIP_SOLANA_RPC_URLS}
      SIP_SOLANA_PROGRAM_ID: ${SIP_SOLANA_PROGRAM_ID:?set SIP_SOLANA_PROGRAM_ID}
      # No edge sits in front of compose, so for a local rehearsal any header
      # name works and every browser shares one bucket.
      SIP_TRUSTED_CLIENT_IP_HEADER: ${SIP_TRUSTED_CLIENT_IP_HEADER:?set SIP_TRUSTED_CLIENT_IP_HEADER}
      # Optional. Blank means the default (the public WebSocket, no seat, the
      # built-in budgets).
      SIP_SOLANA_PUBLIC_WS_URL: ${SIP_SOLANA_PUBLIC_WS_URL:-}
      SIP_SOLANA_PRIVY_SIGNER_ID: ${SIP_SOLANA_PRIVY_SIGNER_ID:-}
      SIP_SOLANA_PRIVY_POLICY_ID: ${SIP_SOLANA_PRIVY_POLICY_ID:-}
      SIP_SOLANA_RELAY_PER_MIN: ${SIP_SOLANA_RELAY_PER_MIN:-}
      SIP_SOLANA_RELAY_SIGNING_GLOBAL_PER_MIN: ${SIP_SOLANA_RELAY_SIGNING_GLOBAL_PER_MIN:-}
      SIP_SOLANA_RELAY_READS_GLOBAL_PER_MIN: ${SIP_SOLANA_RELAY_READS_GLOBAL_PER_MIN:-}
      SIP_SOLANA_SEND_PER_MIN: ${SIP_SOLANA_SEND_PER_MIN:-}
      SIP_SOLANA_SEND_GLOBAL_PER_MIN: ${SIP_SOLANA_SEND_GLOBAL_PER_MIN:-}
      # The image's runner defaults to 3000 and Next reads PORT at start-up. The
      # repo's dev server uses 3002, so the container is told to match rather
      # than the port being mapped across — otherwise the health check below,
      # which runs INSIDE the container, probes a port nothing is listening on.
      PORT: 3002
    ports:
      # Host port only. The container always listens on 3002 (see PORT above),
      # because the healthcheck runs INSIDE it. Override SIP_WEB_PORT when your
      # own dev server already holds this one.
      - "${SIP_WEB_PORT:-3002}:3002"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
