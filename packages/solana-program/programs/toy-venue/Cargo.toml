[package]
name = "toy-venue"
version = "0.1.0"
description = "A swap venue that can be told to misbehave — the counterparty sip-vault's invest guards are tested against"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "toy_venue"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
